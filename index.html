<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="正在前往驚喜頁面...">
    <meta property="og:description" content="點擊後將隨機導向不同內容">
    <title>Redirecting...</title>

    <script type="text/javascript">
        //Google Apps Script 嚴格輪播網址
        const targetUrl = "https://script.google.com/macros/s/AKfycbx2xI1aiUxaeEZTSq87CTYnLyQAH3PCiJDdH1Sf4jjvG7GIEvO0KzgAU9SMtwrMVZClnA/exec";

        function redirect() {
            // 直接導向到 Google Apps Script，由它來決定要去哪個 WhatsApp 連結
            window.location.replace(targetUrl);
        }

        // 盡快執行
        redirect();
    </script>

    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
            color: #333;
        }

        .loader {
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="loader">
        <p>正在為您挑選目的地，請稍候...</p>
    </div>
</body>

</html>
